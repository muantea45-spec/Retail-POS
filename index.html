<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Retail POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // or 'media'
        theme: {
          extend: {
            colors: {
              primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @media print {
    /* Hide everything by default that is not part of the bill */
    body > #root > div > header,
    body > #root > div > main > *:not(.bill-summary-container),
    .no-print {
      display: none !important;
    }

    /* Ensure the bill and its parents are visible */
    body, #root, #root > div, #root > div > main, .bill-summary-container {
      display: block !important;
      visibility: visible !important;
    }
    
    /* Reset base styles for printing */
    body, html {
      width: 100%;
      min-height: auto;
      background: #fff !important;
      color: #000 !important;
      -webkit-print-color-adjust: exact;
      color-adjust: exact;
    }
    
    /* Style the printable bill container to resemble a receipt */
    .bill-summary-container {
      position: static !important;
      width: 80mm; /* Standard thermal receipt paper width */
      max-width: 100% !important;
      margin: 0 !important;
      padding: 3mm !important;
      box-shadow: none !important;
      border: none !important;
      page-break-inside: avoid;
    }

    /* Style the actual receipt content */
    .printable-receipt {
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      background-color: #fff !important;
      font-family: 'Courier New', Courier, monospace; /* Classic receipt font */
      font-size: 9pt;
      line-height: 1.4;
    }

    /* Universal selector to override any lingering dark mode styles within the receipt */
    .printable-receipt * {
       background-color: transparent !important;
       color: #000 !important;
       border-color: #666 !important;
    }
    
    /* Specific style adjustments for receipt elements */
    .printable-receipt .text-primary-600 {
        color: #000 !important;
    }
    
    .printable-receipt h2,
    .printable-receipt .text-xl, .printable-receipt .sm\\:text-2xl {
        font-size: 11pt !important;
        font-weight: 600 !important;
    }

    .printable-receipt .text-xs, .printable-receipt .sm\\:text-sm {
        font-size: 8pt !important;
    }
    
    .printable-receipt .transform.-rotate-3 {
        transform: none !important;
        border-width: 2px !important;
        padding: 4px 8px !important;
        margin-top: 10px;
    }
  }
</style>
</head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
