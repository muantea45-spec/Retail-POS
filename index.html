    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Retail POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // or 'media'
        theme: {
          extend: {
            colors: {
              primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",

  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @media print {
    body, html {
      background: #fff !important;
      color: #000 !important;
      min-height: auto;
    }
    .no-print {
      display: none !important;
    }
    body > #root > div > header,
    body > #root > div > main > *:not(.bill-summary-container) {
      display: none !important;
    }
    .bill-summary-container {
      display: block !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
      border: none !important;
    }
    .printable-receipt {
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      color: #000 !important;
    }
    .printable-receipt .dark\\:bg-slate-800 {
        background-color: #fff !important;
    }
    .printable-receipt .dark\\:text-slate-400,
    .printable-receipt .dark\\:text-slate-500,
    .printable-receipt .dark\\:text-slate-300 {
        color: #333 !important;
    }
     .printable-receipt .dark\\:text-white {
        color: #000 !important;
    }
  }
</style>
</head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
